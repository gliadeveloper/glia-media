[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "glia-media"
version = "0.0.1"
authors = [
  { name = "glia", email = "team.support.glia@gmail.com" },
]
description = "GLIA's independent media processing platform for FFmpeg transcoding and private HLS delivery."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/gliadeveloper/glia-media"
Issues = "https://github.com/gliadeveloper/glia-media/issues"
